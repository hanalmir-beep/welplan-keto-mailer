name: 🥑 Daily Keto Menu Recommendation

on:
  schedule:
    # KST 08:00 월~금
    - cron: '0 8 * * 1-5'
      timezone: 'Asia/Seoul'
  workflow_dispatch: # 수동 실행도 가능

jobs:
  send-menu:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Send keto menu recommendation email
        run: node src/index.js --force
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          EMAIL_FROM_NAME: '웰플랜 저탄고지 추천봇'
          TZ: 'Asia/Seoul'
